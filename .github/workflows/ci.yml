# AgentForge CI — Phase 13.
#
# The first CI this project has ever had. Chapter 1 shipped 297 tests that only ever
# ran when someone remembered to run them; from Phase 13 on, a red pipeline is a
# stop-work condition (CLAUDE.md → "Testing expectations").
#
# Five gates, in the order that fails fastest and cheapest:
#
#   lint       oxlint, ~50 ms. A single prebuilt binary rather than 305 packages of
#              ESLint — the same reasoning that kept this project off the `ai` SDK and
#              on Node's built-in test runner (A15 / D64).
#   typecheck  tsc --noEmit.
#   test       Node's built-in runner, with coverage thresholds that fail the build.
#   docs       Phase 24. The generated node reference must match the registry, and the
#              API reference must name every route and invent none.
#   build      next build. Catches what typecheck cannot: a bad route export, a server
#              component importing client-only code, a failed static analysis pass.
#
# No secrets, no database, no network. `next build` needs no environment here because
# env validation runs at server startup (src/instrumentation.ts) and the database
# client is constructed lazily — the same property the Dockerfile relies on.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Added 2026-10-01, for a reason worth recording: a push to `main` (a530b29) was
  # accepted by GitHub and **no workflow run was ever created for it** — no path
  # filter exists, the workflow was `active`, the repository public, and
  # githubstatus.com reported Actions operational. Without `workflow_dispatch` there
  # was no way to ask for a run on an existing commit, so the only recovery was to
  # push another commit. A red pipeline is a stop-work condition here; a *missing*
  # one is worse, because nothing signals it. This makes re-running it one click.
  workflow_dispatch:

# A second push to the same branch makes the first run irrelevant. Cancelling it keeps
# the free Actions minutes for runs whose answer somebody still wants.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    # NAME IS A CONTRACT, not a label — Phase 24 learned this the hard way. Branch
    # protection requires the status check context "lint · typecheck · test · build",
    # and a context is identified by this string. Renaming the job to mention the docs
    # gate made the required check unsatisfiable, which would have blocked every PR into
    # main while direct pushes still passed (enforce_admins is false). The docs gate runs
    # as a step below; the job name stays exactly as the protection rule expects it.
    name: lint · typecheck · test · build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          # Matches the local toolchain. The test runner leans on Node's native
          # TypeScript type stripping, so this is a floor, not a preference.
          node-version: 26
          cache: npm

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test with coverage
        run: npm run test:coverage

      - name: Documentation is current
        # Phase 24. `docs/nodes.md` is generated from the node registry, and this fails
        # if somebody adds or edits a node without regenerating it. It also asserts that
        # `docs/api.md` names every route under src/app/api and invents none — the two
        # ways an API reference rots. Cheap, and it runs before the build for that reason.
        run: npm run docs:check

      - name: Build
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
